services:
  pinglo:
    build: .
    container_name: pinglo
    restart: unless-stopped
    ports:
      - "3007:3007"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    environment:
      - NODE_ENV=production
      - PORT=3007
      - HOST=0.0.0.0
      - TRUST_PROXY=${TRUST_PROXY:-false}
      - COOKIE_SECURE=${COOKIE_SECURE:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - PINGLO_ENCRYPTION_KEY=${PINGLO_ENCRYPTION_KEY:-}
    volumes:
      - ./data:/app/data
